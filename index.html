<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script type="module" src="/src/main.jsx"></script>
  <title>Gesture Jam</title>
  <style>
    body { margin: 0; padding: 0; }
    #overlay { pointer-events: none; }
  </style>
</head>
<body class="bg-black text-white flex flex-col items-center min-h-screen">
  <div id="root"></div>
  <div class="relative">
    <video id="cam" width="640" height="480" autoplay muted class="border border-gray-600"></video>
    <canvas id="overlay" class="absolute top-0 left-0" width="640" height="480"></canvas>
  </div>
  <div id="controls" class="mt-4 text-center">
    <p class="text-sm text-gray-400">Wave your hands to control the music!</p>
    <p class="text-xs text-gray-500">Left hand: Note triggers • Right hand: Effects control</p>
  </div>
</body>
</html>
